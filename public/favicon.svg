<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14161b" />
      <stop offset="100%" stop-color="#0b0c0f" />
    </linearGradient>
    <linearGradient id="fgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c97a8" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cfd6e0" />
      <stop offset="100%" stop-color="#9ba5b5" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c303a" />
      <stop offset="100%" stop-color="#161820" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="156" height="156" rx="36" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Stylized Fontier "F" Monogram -->
  <g fill="url(#fgGrad)">
    <!-- Top curved bar and stem -->
    <path d="
      M 140,36
      L 140,50
      L 62,50
      C 44,50 36,60 36,78
      L 36,122
      L 22,122
      L 22,76
      C 22,48 38,36 64,36
      Z
    " />
    
    <!-- Middle aerodynamic bar with diagonal taper from stem -->
    <path d="
      M 140,72
      L 140,86
      L 66,86
      C 54,86 42,92 36,101
      L 36,83
      C 44,75 54,72 66,72
      Z
    " />
  </g>
</svg>
